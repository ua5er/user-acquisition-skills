<style>
body{margin:0;background:#050509}
a{color:#ffffff}a:hover{color:#ff9d9a}
.cv2 .ph{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#08080f;box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.09);flex:none}
.cv2 .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cv2 .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:0}
.cv2 .h{margin:0;font-size:40px;font-weight:900;letter-spacing:-1.4px;line-height:1;text-wrap:balance}
.cv2 .sub{margin:0;font-size:16px;line-height:1.45;color:rgba(255,255,255,.78)}
.cv2 .micro{font-size:13px;line-height:1.4;color:rgba(255,255,255,.7)}
.cv2 .need{display:inline-block;padding:4px 8px;border:1px dashed rgba(255,193,77,.7);border-radius:6px;font-size:12px;line-height:1.35;font-weight:600;color:#ffc14d}

/* story bar */
.cv2 .sbar{position:absolute;top:60px;left:16px;right:16px;display:flex;gap:4px;z-index:3}
.cv2 .seg{position:relative;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.cv2 .seg.done{background:#ffffff}
.cv2 .seg i{position:absolute;inset:0;border-radius:2px;background:#ffffff;transform-origin:0 50%;animation:segfill 12s linear infinite}
@keyframes segfill{0%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
.cv2 .mark{position:absolute;top:76px;left:16px;display:flex;align-items:center;gap:8px;z-index:3}

/* CTAs: gradient with white sheen, white with a dark-tinted subtle sheen. Sheen on transform only */
.cv2 .cta,.cv2 .wcta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:56px;border-radius:28px;font-size:17px;font-weight:700;text-decoration:none;transition:transform 120ms ease-out}
.cv2 .cta{background:linear-gradient(90deg,#ff746f,#c14ca8 55%,#5d5bd7);color:#ffffff}
.cv2 .cta:hover{color:#ffffff}
.cv2 .wcta{background:#ffffff;color:#0b0b12}
.cv2 .wcta:hover{color:#0b0b12}
.cv2 .cta:active,.cv2 .wcta:active{transform:scale(.97)}
.cv2 .cta::after,.cv2 .wcta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;transform:translateX(-150%);animation:sheen 7s ease-in-out 1.2s infinite both;pointer-events:none}
.cv2 .cta::after{background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0))}
.cv2 .wcta::after{background:linear-gradient(100deg,rgba(11,11,18,0),rgba(11,11,18,.1),rgba(11,11,18,0))}
@keyframes sheen{0%{transform:translateX(-150%)}17%,100%{transform:translateX(325%)}}

/* reading-rhythm entrance: opacity + 12px, one curve everywhere */
.cv2 .in{animation:rise 450ms cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.cv2 .tap{position:absolute;z-index:2;display:block}

/* C1 */
.cv2 .kb{animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}

/* C2 picker */
.cv2 .pv{opacity:0;z-index:0;transition:opacity 0s linear 450ms}
.cv2 .pv.on{opacity:1;z-index:1;transition:opacity 450ms cubic-bezier(.2,.8,.2,1)}
.cv2 .trow{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;animation:rise 400ms cubic-bezier(.2,.8,.2,1) both}
.cv2 .tile{position:relative;display:block;height:124px;padding:0;border:0;border-radius:16px;overflow:hidden;background:#15151f;color:#ffffff;font-family:inherit;cursor:pointer;opacity:.8;transition:transform 160ms ease-out,opacity 200ms ease-out}
.cv2 .tile.on{opacity:1}
.cv2 .tile:active{transform:scale(.96)}
.cv2 .tile:focus-visible{outline:2px solid #ffffff;outline-offset:2px}
.cv2 .tile .tname{position:absolute;left:10px;bottom:8px;font-size:13px;font-weight:600;line-height:1.2;text-align:left}
.cv2 .tile .tscrim{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,rgba(8,8,15,0),rgba(8,8,15,.85))}
.cv2 .ring{position:absolute;inset:0;border-radius:16px;padding:2px;background:linear-gradient(135deg,#ff746f,#c14ca8 55%,#5d5bd7);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity 200ms ease-out;pointer-events:none}
.cv2 .badge{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:10px;background:#ffffff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 200ms ease-out}
.cv2 .tile.on .ring,.cv2 .tile.on .badge{opacity:1}

/* C3 prompt words */
.cv2 .w{display:inline-block;margin-right:4px;animation:word 12s linear infinite both}
@keyframes word{0%{opacity:0}1.7%,94%{opacity:1}98%,100%{opacity:0}}

/* C4 wall */
.cv2 .col{position:absolute;width:122px;display:flex;flex-direction:column;gap:8px;will-change:transform}
.cv2 .col img{width:122px;height:180px;border-radius:16px;object-fit:cover;display:block;flex:none}
.cv2 .up{animation:up 16s ease-in-out infinite alternate}
.cv2 .down{animation:down 16s ease-in-out infinite alternate}
@keyframes up{to{transform:translateY(-24px)}}
@keyframes down{to{transform:translateY(24px)}}
.cv2 .rev{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}

/* C5 fan */
.cv2 .fan{position:absolute;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.cv2 .fan .card{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:#15151f}
.cv2 .fan .card.ringed{padding:2px;background:linear-gradient(135deg,#ff746f,#c14ca8 55%,#5d5bd7)}
.cv2 .fan .card.dim{opacity:.6}
.cv2 .fan img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.cv2 .fan-c{animation:dealc 450ms cubic-bezier(.2,.8,.2,1) both}
.cv2 .fan-l{animation:deall 500ms cubic-bezier(.2,.8,.2,1) 80ms both}
.cv2 .fan-r{animation:dealr 500ms cubic-bezier(.2,.8,.2,1) 80ms both}
@keyframes dealc{from{opacity:0;transform:scale(.94)}}
@keyframes deall{from{opacity:0;transform:translateX(24px) rotate(0deg)}}
@keyframes dealr{from{opacity:0;transform:translateX(-24px) rotate(0deg)}}

/* performance: everything stops while the artboard is off-screen */
.cv2.is-off *,.cv2.is-off *::after{animation-play-state:paused !important}
@media (prefers-reduced-motion: reduce){
  .cv2 *,.cv2 *::after{animation:none !important;transition:none !important}
}
</style>

class Component extends DCLogic {
  // Perf contract: one setState per tap, no intervals, no rAF. CSS drives every loop.
  // An IntersectionObserver sets "live"; off-screen the root gets .is-off (all animations paused) and the video pauses.
  state = { picks: ['golden'] };
  setRoot = (el) => { if (el) this.root = el; };
  componentDidMount() {
    if (!this.root) this.root = document.querySelector('[data-board="Cv2"]');
    this.reduce = false;
    try { this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (this.root && 'IntersectionObserver' in window) {
      this.io = new IntersectionObserver((entries) => {
        this.setLive(entries[entries.length - 1].isIntersecting);
      }, { threshold: 0.05 });
      this.io.observe(this.root);
    } else {
      this.setLive(true);
    }
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    this.setLive(false);
  }
  setLive(on) {
    this.live = on;
    const r = this.root;
    if (!r) return;
    r.classList.toggle('is-off', !on);
    r.querySelectorAll('video').forEach((v) => {
      if (on && !this.reduce) { v.muted = true; v.playsInline = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else v.pause();

  }
  toggle(id) {
    this.setState((st) => {
      const p = st.picks.slice();
      const i = p.indexOf(id);

        if (p.length === 1) return null;
        p.splice(i, 1);

        p.push(id);
      }
      return { picks: p };
    });
  }
