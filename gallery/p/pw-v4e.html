<script type="text/x-dc" data-dc-script data-props='{"defaultPlan":{"editor":"enum","options":["w1","m1"],"default":"m1","tsType":"string","section":"Plans"},"offerMinutes":{"editor":"int","default":10,"min":1,"max":60,"step":1,"unit":"min","tsType":"number","section":"Offer"},"$preview":{"width":402,"height":874}}'>
const PLANS = [

  { id: "m1", name: "1 Month", price: "$14.99", renew: "$29.99", period: "month", old: "$29.99", unit: "first month", perDay: "$0.50", oldDay: "$1.00", save: "−50%", tag: "Most popular" }
];
const FIELDS = [
  { id: "v4e-email", label: "Email", type: "email", mode: "email", auto: "email", ph: "you@example.com", span: "1 / -1" },
  { id: "v4e-card", label: "Card number", type: "text", mode: "numeric", auto: "cc-number", ph: "1234 1234 1234 1234", span: "1 / -1" },

  { id: "v4e-cvc", label: "CVC", type: "text", mode: "numeric", auto: "cc-csc", ph: "CVC", span: "auto" },
  { id: "v4e-name", label: "Name on card", type: "text", mode: "text", auto: "cc-name", ph: "Full name", span: "1 / -1" }
];

const COUNTERS = [{ targets: [248913], period: 9000, from: 0.04, to: 0.6 }, { targets: [1248913], period: 9000, from: 0.04, to: 0.66 }];

class Component extends DCLogic {
  state = { plan: null, method: "apple", sheet: false, left: null };

  componentDidMount() {
    this.startCounters();
    this.timer = setInterval(() => {
      const cur = this.state.left == null ? (this.props.offerMinutes ?? 10) * 60 : this.state.left;
      if (cur <= 0) { clearInterval(this.timer); return; }
      this.setState({ left: cur - 1 });
    }, 1000);
  }

  componentWillUnmount() { clearInterval(this.timer); cancelAnimationFrame(this.craf); }

  cel = [];
  cref = [0, 1, 2, 3].map((i) => (el) => { this.cel[i] = el; });

  startCounters() {
    const fmt = (n) => Math.round(n).toLocaleString("en-US");
    const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const t0 = Date.now();
    const tick = () => {
      const t = Date.now() - t0;
      COUNTERS.forEach((c, i) => {
        const el = this.cel[i];
        if (!el) return;
        const target = c.targets[Math.floor(t / c.period) % c.targets.length];
        const p = (t % c.period) / c.period;

        if (!still) {

          else if (p < c.to) { const k = (p - c.from) / (c.to - c.from); val = target * k * k * (3 - 2 * k); }

        const s = fmt(val);
        if (el.textContent !== s) el.textContent = s;

    if (still) return;

    const loop = (now) => {
      this.craf = requestAnimationFrame(loop);
      if (now - last < 80) return;
      last = now;
      tick();
    };
    this.craf = requestAnimationFrame(loop);
  }

    const selId = this.state.plan || this.props.defaultPlan || "m1";

    const m = this.state.method;
    const note = sel.plain

    const lines = sel.plain

         { label: "Intro discount −50%", value: "−$15.00", color: "#9ff3cb" }];
    const renewLine = sel.plain ? "Renews at " + sel.renew + "/week" : "Then " + sel.renew + "/month";

    const pr = (k) => (m === k ? "true" : "false");
    return {
      plans: PLANS.map(p => {
        const on = p.id === sel.id;

          name: p.name, tag: p.tag, hasTag: !!p.tag,
          save: p.save, hasSave: !!p.save, old: p.old, hasOld: !!p.old,
          price: p.price, unit: p.unit, perDay: p.perDay, pressed: on ? "true" : "false",
          ring: on ? "linear-gradient(140deg, #8b89f0 0%, #ff746f 100%)" : "rgba(255,255,255,0.14)",
          bg: on ? "#1c1b2b" : "#111119",
          subColor: on ? "rgba(255,255,255,0.86)" : "rgba(255,255,255,0.68)",
          radioBorder: on ? "2px solid #ffffff" : "2px solid rgba(255,255,255,0.45)",
          radioBg: on ? "#ffffff" : "transparent",
          dot: on ? 1 : 0, dotScale: on ? 1 : 0.9, oldDay: p.oldDay, hasOldDay: !!p.oldDay,
          pick: () => this.setState({ plan: p.id })
        };
      }),
      fields: FIELDS,
      c0: this.cref[0], c1: this.cref[1], c2: this.cref[2], c3: this.cref[3],
      timer: pad(Math.floor(left / 60)) + ":" + pad(left % 60),
      lines: lines, renewLine: renewLine, hasSaving: !sel.plain, saving: "$15.00",
      note: note, fineprint: fineprint, total: total,
      sheetOpen: this.state.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      showCardForm: m === "card",
      appleBorder: wb("apple"), googleBorder: wb("google"), cardBorder: wb("card"),
      appleBg: wbg("apple"), googleBg: wbg("google"), cardBg: wbg("card"),
      applePressed: pr("apple"), googlePressed: pr("google"), cardPressed: pr("card"),
      payLabel: m === "card" ? "Pay " + total : (m === "apple" ? "Pay with Apple Pay" : "Pay with Google Pay"),
      pickApple: () => this.setState({ method: "apple" }),
      pickGoogle: () => this.setState({ method: "google" }),
      pickCard: () => this.setState({ method: "card" })
    };
  }
}
