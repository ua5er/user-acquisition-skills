<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Studio onboarding D v2 · your profile</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050509}
a{color:#f2f0f5}a:hover{color:#ff9d9a}
::selection{background:rgba(255,116,111,.35);color:#ffffff}
.ph{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#08080f;box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);flex:none;color:#f2f0f5;isolation:isolate}
.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.h1{margin:0;font-weight:900;font-size:36px;line-height:1.04;letter-spacing:-0.03em;text-wrap:balance}
.h2{display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:40px;line-height:1;letter-spacing:0;color:#ff9d9a}
.sub{margin:0;font-size:15px;line-height:22px;color:rgba(242,240,245,.76)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:13px;line-height:28px;color:rgba(242,240,245,.62);display:flex;align-items:center;gap:10px;white-space:nowrap}
.lbl b{display:inline-block;padding:0 8px;line-height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.18);font-weight:600;color:#f2f0f5}
.need{display:inline-block;padding:0 8px;line-height:22px;border-radius:6px;border:1px dashed rgba(255,157,154,.6);color:#ff9d9a;font-size:12px;font-weight:500}
.prog{position:absolute;top:20px;left:24px;right:24px;display:flex;gap:4px;z-index:4}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
.prog i.on{background:#f2f0f5}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:28px;background:linear-gradient(90deg,#ff746f,#c14ca8 55%,#5d5bd7);color:#ffffff;font-size:17px;font-weight:700;text-decoration:none;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .16s cubic-bezier(.23,1,.32,1)}
.cta:hover{color:#ffffff}
.cta:active{transform:scale(.97)}
.cta:focus-visible{outline:2px solid #f2f0f5;outline-offset:3px}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.3),rgba(255,255,255,0));transform:translateX(-130%) skewX(-20deg);will-change:transform;animation:kSheen 7s ease-in-out 2.4s infinite}
.cta.s3::after{animation-delay:3s}
.cta.wait::after{animation:none}
.cta.late::after{animation-delay:5s}
.nudge{display:block;animation:kNudge 7s ease-in-out 2.4s infinite}
.ibtn{width:44px;height:44px;padding:0;border:0;background:none;color:#f2f0f5;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px}
.ibtn:focus-visible,.tile:focus-visible,.chip:focus-visible,.photo:focus-visible{outline:2px solid #f2f0f5;outline-offset:2px}
.in{animation:kIn .5s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:kFade .4s cubic-bezier(.2,.8,.2,1) both}
.settle{animation:kSettle 1.2s cubic-bezier(.2,.8,.2,1) both}
.open{animation:kOpen .5s cubic-bezier(.2,.8,.2,1) both}
.beat{display:block;animation:kBeat 9s cubic-bezier(.2,.8,.2,1) infinite}
.b9{position:absolute;left:0;top:0;margin:-9px 0 0 -9px;opacity:0;animation:kBurst 9s cubic-bezier(.23,1,.32,1) 1.2s infinite}
.fly{position:absolute;left:0;top:0;opacity:0;animation:kFly 2.2s cubic-bezier(.23,1,.32,1) both}
.big{position:absolute;left:50%;top:300px;width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0;animation:kBig 1s cubic-bezier(.2,.8,.2,1) both}
.th{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;opacity:0;animation:kTapH 1.2s cubic-bezier(.2,.8,.2,1) both}
.rh{position:absolute;left:12px;top:0;width:18px;height:18px;opacity:0;animation:kRail 6s cubic-bezier(.2,.8,.2,1) infinite}
.rl .ibtn svg,.rl .num{filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.tile{position:relative;display:block;width:100%;height:155px;padding:0;border:0;background:none;cursor:pointer;perspective:800px;border-radius:10px;color:#f2f0f5;font-family:Archivo,sans-serif}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.flip.demo{animation:kDemo .6s cubic-bezier(.2,.8,.2,1) .5s both}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.popA{animation:kPopA .5s cubic-bezier(.2,.8,.2,1) .3s both}
.popB{animation:kPopB .5s cubic-bezier(.2,.8,.2,1) .3s both}
.popD{animation:kPopA .5s cubic-bezier(.2,.8,.2,1) 1.1s both}
.hrt{position:absolute;top:8px;right:8px;width:20px;height:20px;transition:opacity .3s cubic-bezier(.2,.8,.2,1) .45s}
.hrt.hd{animation:kFade .3s cubic-bezier(.2,.8,.2,1) 1.1s both}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:rgba(8,8,15,.55);color:#f2f0f5;font-family:Archivo,sans-serif;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .2s ease-out,border-color .2s ease-out,color .2s ease-out}
.chip[aria-pressed="true"]{background:#f2f0f5;border-color:#f2f0f5;color:#08080f}
.pr{position:absolute;inset:0;display:flex;align-items:center;transition:opacity .3s cubic-bezier(.2,.8,.2,1)}
.vid{transition:opacity .3s cubic-bezier(.2,.8,.2,1)}
.photo{position:absolute;left:0;right:0;top:0;height:470px;padding:0;border:0;background:none;cursor:pointer;z-index:2}
.draw{transform-origin:0 50%;animation:kDraw 1.8s cubic-bezier(.4,0,.6,1) .6s both}
.lit{animation:kLit .4s cubic-bezier(.2,.8,.2,1) both}
.note{position:absolute;left:0;right:0;height:64px;box-sizing:border-box;padding:0 12px;border-radius:16px;background:#15151d;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px;opacity:0;animation:kNote 12s cubic-bezier(.32,.72,0,1) infinite}
.gt{position:relative;height:118px;overflow:visible}
.pop9{position:absolute;inset:0;animation:kTile 9s cubic-bezier(.77,0,.175,1) infinite}
.wave{opacity:0;animation:kWave 9s ease-in-out infinite}
.nm-off *,.nm-off *::before,.nm-off *::after{animation-play-state:paused!important}
@keyframes kSheen{0%,82.8%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(280%) skewX(-20deg)}}
@keyframes kNudge{0%,86%,100%{transform:none}91%{transform:translateX(4px)}}
@keyframes kIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes kFade{from{opacity:0}to{opacity:1}}
@keyframes kSettle{from{transform:scale(1.04)}to{transform:none}}
@keyframes kOpen{from{opacity:.4;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes kBeat{0%,12%,18%,100%{transform:scale(1)}14.5%{transform:scale(1.22)}}
@keyframes kBurst{0%{opacity:0;transform:translate(0,0) scale(.4)}2%{opacity:1}17%{opacity:1}24.4%,100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1) rotate(var(--r))}}
@keyframes kFly{0%{opacity:0;transform:translate(0,0) scale(.4)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2) rotate(var(--r))}}
@keyframes kBig{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.08)}55%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes kTapH{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-64px)}}
@keyframes kRail{0%{opacity:0;transform:translate(0,0) scale(.6)}4%{opacity:1}30%,100%{opacity:0;transform:translate(var(--x),-120px) scale(1)}}
@keyframes kDemo{from{transform:rotateY(0deg)}to{transform:rotateY(180deg)}}
@keyframes kPopA{0%,100%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes kPopB{0%,100%{transform:scale(1)}45%{transform:scale(1.06)}}
@keyframes kDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kLit{from{opacity:.5}to{opacity:1}}
@keyframes kNote{0%{opacity:0;transform:translateY(-16px)}4.5%,37%{opacity:1;transform:none}41%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes kTile{0%,16%,100%{transform:scale(1);z-index:1}4%,12%{transform:scale(1.06);z-index:3}}
@keyframes kWave{0%,18%,100%{opacity:0}4%,13%{opacity:1}}
@media (prefers-reduced-motion: reduce){
.cta::after,.b9,.fly,.big,.th,.rh,.note{animation:none;opacity:0}
.nudge,.beat,.in,.fade,.settle,.open,.draw,.lit,.pop9,.popA,.popB,.popD,.hrt.hd,.flip.demo{animation:none}
.wave{animation:none;opacity:0}
.flip,.hrt,.pr,.vid,.chip{transition:none}
}
</style>

<style>html,body{margin:0;overflow:hidden}</style>
</head><body>
<div id="dc-root"></div>
<template id="dc-template">

<div ref="{{ rootRef }}" class="{{ rootCls }}" style="position: relative; width: 2636px; height: 1140px; box-sizing: border-box; padding: 48px; background: #050509; color: #f2f0f5; font-family: Archivo, sans-serif; display: flex; flex-direction: column; gap: 40px;">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute;"><defs><linearGradient id="dv2Tri" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5d5bd7"></stop><stop offset="0.34" stop-color="#5d5bd7"></stop><stop offset="0.34" stop-color="#c14ca8"></stop><stop offset="0.66" stop-color="#c14ca8"></stop><stop offset="0.66" stop-color="#ff746f"></stop><stop offset="1" stop-color="#ff746f"></stop></linearGradient></defs></svg>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 44px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05;">Concept D · your profile</div>
    <div style="font-size: 16px; line-height: 24px; color: rgba(242,240,245,0.72); max-width: 1440px;">The user builds the profile: the first screen continues the ad with one portrait, selfies flip into looks on tap, they like their own post, and the chosen looks come back in a finished profile.</div>
  </div>

  <div style="display: flex; gap: 40px; align-items: flex-start;">

    <!-- D1 the post -->
    <div id="dv2-1" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="lbl"><b>D1</b>Post · continues the ad</div>
      <div class="ph">
        <img class="fill settle" src="img/c7b39acdcee3aa3a7156c23c5c82e238.webp" alt="Portrait in a red dress in a sunlit room" style="object-position: 50% 28%;">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,15,0.55) 0%, rgba(8,8,15,0) 16%, rgba(8,8,15,0) 40%, rgba(8,8,15,0.84) 60%, #08080f 74%);"></div>
        <div style="position: absolute; top: 44px; left: 20px; right: 20px; height: 36px; display: flex; align-items: center; gap: 10px;">
          <img src="img/f091ec11cd7c7fb5d1f245b676eb053d.webp" alt="" style="width: 28px; height: 28px; border-radius: 14px; object-fit: cover; object-position: 50% 15%;">
          <span style="font-size: 14px; font-weight: 600;">your.looks</span>
        </div>
        <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column;">
          <div class="in" style="position: relative; align-self: flex-start; height: 44px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 22px; background: rgba(8,8,15,0.72); border: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; gap: 8px; animation-delay: 0.9s;">
            <span style="position: relative; width: 22px; height: 22px; flex: none;">
              <svg class="beat" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.7-9.3C.8 7.6 2.9 4.2 6.4 4.2c2.2 0 3.7 1.2 4.6 2.6.5.8.6.8 1 .8s.5 0 1-.8c.9-1.4 2.4-2.6 4.6-2.6 3.5 0 5.6 3.4 4.1 6.8-2.1 4.7-9.7 9.3-9.7 9.3z" fill="url(#dv2Tri)"></path></svg>
              <span style="position: absolute; left: 11px; top: 11px; pointer-events: none;">
                <sc-for list="{{ burst1 }}" as="h" hint-placeholder-count="10">
                  <svg class="b9" viewBox="0 0 24 24" aria-hidden="true" style="width: {{ h.s }}; height: {{ h.s }}; --x: {{ h.x }}; --y: {{ h.y }}; --r: {{ h.r }};"><path d="M12 20.3s-7.6-4.6-9.7-9.3C.8 7.6 2.9 4.2 6.4 4.2c2.2 0 3.7 1.2 4.6 2.6.5.8.6.8 1 .8s.5 0 1-.8c.9-1.4 2.4-2.6 4.6-2.6 3.5 0 5.6 3.4 4.1 6.8-2.1 4.7-9.7 9.3-9.7 9.3z" fill="url(#dv2Tri)"></path></svg>
                </sc-for>
              </span>
            </span>
            <span ref="{{ c1Ref }}" class="num" style="min-width: 48px; font-size: 17px; font-weight: 700;">0</span>
            <span style="font-size: 14px; color: rgba(242,240,245,0.74);">likes</span>
          </div>
          <h1 class="h1" style="margin-top: 20px;">Post like you hired<span class="h2">a photographer</span></h1>
          <p class="sub" style="margin-top: 12px;">Upload a few selfies. Get studio portraits and short videos in about 5 minutes.</p>
          <div style="margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(242,240,245,0.76);">
            <span style="display: flex; gap: 2px;" role="img" aria-label="Rated 4.9 out of 5">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#f2f0f5"></path></svg>
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#f2f0f5"></path></svg>
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#f2f0f5"></path></svg>
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#f2f0f5"></path></svg>
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="#f2f0f5"></path></svg>
            </span>
            <span><span class="num">4.9</span> rating · <span class="num">2</span> million portraits</span>
          </div>
          <a class="cta s3" href="#dv2-2" style="margin-top: 24px;">Pick my first looks</a>
        </div>
      </div>
    </div>

    <!-- D2 tap selfies into looks -->
    <div id="dv2-2" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="lbl"><b>D2</b>Selfies to looks · first choice<span class="need"></span></div>
      <div class="ph">
        <div class="prog"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
        <div style="position: absolute; top: 44px; left: 24px; right: 24px; height: 40px; display: flex; align-items: center; gap: 10px;">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed rgba(242,240,245,0.4); flex: none;"></span>
          <span style="flex: 1; font-size: 14px; font-weight: 600;">your.looks</span>
          <span style="font-size: 13px; color: rgba(242,240,245,0.74);"><span class="num">{{ postsLabel }}</span></span>
        </div>
        <div style="position: absolute; top: 112px; left: 24px; right: 24px;">
          <h2 class="h1">Same face<span class="h2">New feed</span></h2>
          <p class="sub" style="margin-top: 12px;">Tap a selfie to see it as a look. Keep the ones you want first.</p>
        </div>
        <div style="position: absolute; top: 272px; left: 16px; right: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
          <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
            <button class="tile {{ t.popCls }}" type="button" onClick="{{ t.toggle }}" aria-pressed="{{ t.pressed }}" aria-label="{{ t.aria }}">
              <span class="flip {{ t.flipCls }}" style="transform: rotateY({{ t.deg }});">
                <span class="face" style="background: #12121a; border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: rgba(242,240,245,0.62);">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><circle cx="12" cy="6" r="1"></circle><path d="M10 18.5h4"></path></svg>
                  <span style="font-size: 13px; line-height: 16px; color: #f2f0f5;">{{ t.name }}</span>
                </span>
                <span class="face" style="transform: rotateY(180deg);">
                  <img class="fill" src="{{ t.src }}" alt="" style="object-position: 50% 22%;">
                  <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(180deg, rgba(8,8,15,0), rgba(8,8,15,0.82));"></span>
                  <span style="position: absolute; left: 8px; right: 8px; bottom: 8px; font-size: 13px; line-height: 16px; font-weight: 600; text-align: left;">{{ t.name }}</span>
                  <svg class="hrt {{ t.heartCls }}" viewBox="0 0 24 24" aria-hidden="true" style="opacity: {{ t.heartOp }};"><path d="M12 20.3s-7.6-4.6-9.7-9.3C.8 7.6 2.9 4.2 6.4 4.2c2.2 0 3.7 1.2 4.6 2.6.5.8.6.8 1 .8s.5 0 1-.8c.9-1.4 2.4-2.6 4.6-2.6 3.5 0 5.6 3.4 4.1 6.8-2.1 4.7-9.7 9.3-9.7 9.3z" fill="url(#dv2Tri)"></path></svg>
                </span>
              </span>
            </button>
          </sc-for>
        </div>
        <p style="position: absolute; top: 606px; left: 24px; right: 24px; margin: 0; font-size: 13px; line-height: 18px; color: rgba(242,240,245,0.62);">Sample photos. You add your own selfies after this.</p>
        <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column; gap: 16px;">
          <div class="num" style="font-size: 14px; line-height: 20px; color: rgba(242,240,245,0.76); text-align: center;" aria-live="polite">{{ pickedLabel }}</div>
          <a class="cta" href="#dv2-3">{{ saveLabel }}</a>
        </div>
      </div>
    </div>

    <!-- D3 your post, your double-tap (peak) -->
    <div id="dv2-3" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="lbl"><b>D3</b>Your post, your like · peak</div>
      <div class="ph">
        <img class="fill open" src="{{ topSrc }}" alt="{{ topAlt }}" style="object-position: 50% 24%;">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,15,0.6) 0%, rgba(8,8,15,0) 16%, rgba(8,8,15,0) 40%, rgba(8,8,15,0.84) 58%, #08080f 72%);"></div>
        <div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
        <div style="position: absolute; top: 40px; left: 20px; right: 20px; height: 36px; display: flex; align-items: center; gap: 10px; z-index: 3;">
          <img src="{{ topSrc }}" alt="" style="width: 28px; height: 28px; border-radius: 14px; object-fit: cover; object-position: 50% 18%;">
          <span style="font-size: 14px; font-weight: 600;">your.looks</span>
        </div>
        <button class="photo" type="button" onClick="{{ tapPhoto }}" aria-label="Like this post"></button>
        <sc-if value="{{ unliked }}" hint-placeholder-val="{{ true }}">
          <div class="fade" style="position: absolute; left: 0; right: 0; top: 280px; display: flex; justify-content: center; pointer-events: none; z-index: 3; animation-delay: 0.8s;">
            <span style="height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(8,8,15,0.66); border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.7-9.3C.8 7.6 2.9 4.2 6.4 4.2c2.2 0 3.7 1.2 4.6 2.6.5.8.6.8 1 .8s.5 0 1-.8c.9-1.4 2.4-2.6 4.6-2.6 3.5 0 5.6 3.4 4.1 6.8-2.1 4.7-9.7 9.3-9.7 9.3z"></path></svg>
