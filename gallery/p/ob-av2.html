<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Studio onboarding A v2 · contact sheet</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050509}
a{color:#ffffff}a:hover{color:#ff9d9a}
.ph{position:relative;display:block;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#08080f;box-shadow:0 40px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.09);flex:none;color:#ffffff;text-decoration:none;font-family:Archivo,sans-serif}
a.ph:hover{color:#ffffff}
.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:0}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;margin-right:10px;border:1px solid rgba(255,255,255,.25);border-radius:6px;font-size:12px;font-weight:700;color:#ffffff}
.need{color:#ffc14d}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:56px;border-radius:28px;background:linear-gradient(90deg,#ff746f,#c14ca8 55%,#5d5bd7);color:#ffffff;font-size:17px;font-weight:700;text-decoration:none;transition:transform .14s cubic-bezier(.2,.8,.2,1),opacity .16s ease-out}
.cta:hover{color:#ffffff}
.cta:active{transform:scale(.98)}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:translateX(-150%);animation:sheen 7s ease-in-out infinite}
.cta-off{opacity:.4;pointer-events:none}
.pbar{position:absolute;top:62px;left:24px;right:24px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.pfill{position:absolute;inset:0;background:#ff9d9a;transform-origin:left center}
.pb2{transform:scaleX(.3);animation:pb2 .5s cubic-bezier(.2,.8,.2,1) .1s both}
.pb3{transform:scaleX(.55);animation:pb3 .5s cubic-bezier(.2,.8,.2,1) .1s both}
.pb4{transform:scaleX(.8);animation:pb4 .5s cubic-bezier(.2,.8,.2,1) .1s both}
.pb5{transform:none;animation:pb5 .5s cubic-bezier(.2,.8,.2,1) .1s both}
.rise{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.x2{opacity:0;animation:x2 22.2s ease-in-out infinite;will-change:opacity}
.x3{opacity:0;animation:x3 22.2s ease-in-out infinite;will-change:opacity}
.c1{animation:c1 22.2s linear infinite}
.c2{opacity:0;animation:c2 22.2s linear infinite}
.c3{opacity:0;animation:c3 22.2s linear infinite}
.cap{position:absolute;top:0;right:0;height:28px;padding:0 12px;border-radius:14px;background:rgba(8,8,15,.64);display:flex;align-items:center;font-size:13px;font-weight:600;white-space:nowrap}
.row{display:flex;align-items:center;gap:14px;width:100%;height:92px;box-sizing:border-box;padding:10px 16px 10px 10px;border-radius:20px;color:#ffffff;font-family:Archivo,sans-serif;text-align:left;cursor:pointer;transition:border-color .16s ease-out,background-color .16s ease-out}
.bump{animation:bump .24s cubic-bezier(.2,.8,.2,1)}
.rdot{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.tile{position:relative;height:140px;padding:0;border-radius:18px;overflow:hidden;border:0;background:#16162a;cursor:pointer}
.selring{position:absolute;inset:0;border-radius:18px;border:2px solid #ff9d9a;pointer-events:none;transition:opacity .16s ease-out}
.check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:13px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff;transition:background-color .16s ease-out}
.slot{width:44px;height:56px;border-radius:10px;box-sizing:border-box;overflow:hidden;flex:none}
.trayin{animation:trayin .32s cubic-bezier(.2,.8,.2,1) both}
.frame{position:relative;border-radius:14px;overflow:hidden;background:#16162a}
.flabel{position:absolute;left:10px;bottom:9px;font-size:12px;font-weight:700;color:#ffffff}
.fscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,15,0) 58%,rgba(8,8,15,.78) 100%)}
.bf1{animation:bf1 9s cubic-bezier(.2,.8,.2,1) infinite}
.bf2{animation:bf2 9s cubic-bezier(.2,.8,.2,1) infinite}
.bf3{animation:bf3 9s cubic-bezier(.2,.8,.2,1) infinite}
.bf4{animation:bf4 9s cubic-bezier(.2,.8,.2,1) infinite}
.bt1{animation:bt1 9s cubic-bezier(.2,.8,.2,1) infinite}
.bt2{animation:bt2 9s cubic-bezier(.2,.8,.2,1) infinite}
.bt3{animation:bt3 9s cubic-bezier(.2,.8,.2,1) infinite}
.bl1{animation:bl1 9s ease-out infinite}
.bl2{animation:bl2 9s ease-out infinite}
.bl3{animation:bl3 9s ease-out infinite}
.btimer{transform-origin:left center;animation:btimer 9s linear infinite}
.dev{opacity:0;animation:dev .6s cubic-bezier(.2,.8,.2,1) both}
.devimg{animation:devimg .6s cubic-bezier(.2,.8,.2,1) both}
.gring{animation:fadein .3s ease-out 1.07s both}
.settle{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:600}
.seg{position:absolute;left:10px;top:11px;bottom:-39px;width:1.5px;background:rgba(255,255,255,.28);transform-origin:top center;animation:seg .6s linear both}
.node{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:11px;box-sizing:border-box;animation:node .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheen{0%,82.86%{transform:translateX(-150%)}100%{transform:translateX(325%)}}
@keyframes pb2{from{transform:scaleX(.12)}to{transform:scaleX(.3)}}
@keyframes pb3{from{transform:scaleX(.3)}to{transform:scaleX(.55)}}
@keyframes pb4{from{transform:scaleX(.55)}to{transform:scaleX(.8)}}
@keyframes pb5{from{transform:scaleX(.8)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes x2{0%,29.28%{opacity:0}33.33%,66.67%{opacity:1}66.7%,100%{opacity:0}}
@keyframes x3{0%,62.61%{opacity:0}66.67%,95.95%{opacity:1}100%{opacity:0}}
@keyframes c1{0%,30.4%{opacity:1}31.3%,97.1%{opacity:0}97.97%,100%{opacity:1}}
@keyframes c2{0%,30.4%{opacity:0}31.3%,63.7%{opacity:1}64.6%,100%{opacity:0}}
@keyframes c3{0%,63.7%{opacity:0}64.6%,97.1%{opacity:1}97.97%,100%{opacity:0}}
@keyframes bump{0%,100%{transform:none}50%{transform:scale(1.04)}}
@keyframes trayin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes bf1{0%,3.33%{opacity:0;transform:scale(.96)}8.67%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bf2{0%,10%{opacity:0;transform:scale(.96)}15.33%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bf3{0%,16.67%{opacity:0;transform:scale(.96)}22%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bf4{0%,23.33%{opacity:0;transform:scale(.96)}28.67%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bt1{0%,3.33%{opacity:0;transform:scale(.8)}6.67%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bt2{0%,16.67%{opacity:0;transform:scale(.8)}20%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bt3{0%,23.33%{opacity:0;transform:scale(.8)}26.67%,91.11%{opacity:1;transform:none}96.67%,100%{opacity:0;transform:none}}
@keyframes bl1{0%,3.33%{opacity:.56}6.67%,91.11%{opacity:1}96.67%,100%{opacity:.56}}
@keyframes bl2{0%,16.67%{opacity:.56}20%,91.11%{opacity:1}96.67%,100%{opacity:.56}}
@keyframes bl3{0%,23.33%{opacity:.56}26.67%,91.11%{opacity:1}96.67%,100%{opacity:.56}}
@keyframes btimer{0%{transform:scaleX(0);opacity:1}40%,91.11%{transform:none;opacity:1}96.67%,100%{transform:none;opacity:0}}
@keyframes dev{from{opacity:1}to{opacity:0}}
@keyframes devimg{from{transform:scale(1.04)}to{transform:none}}
@keyframes seg{from{transform:scaleY(0)}to{transform:none}}
@keyframes node{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.nm-off,.nm-off *,.nm-off *::before,.nm-off *::after{animation-play-state:paused !important}
@media (prefers-reduced-motion: reduce){.av2 *,.av2 *::before,.av2 *::after{animation:none !important;transition:none !important}}
</style>

<style>html,body{margin:0;overflow:hidden}</style>
</head><body>
<div id="dc-root"></div>
<template id="dc-template">

<div ref="{{ rootRef }}" class="av2 {{ rootClass }}" style="width: 2636px; height: 1140px; box-sizing: border-box; padding: 48px; background: #050509; color: #ffffff; font-family: Archivo, sans-serif; display: flex; flex-direction: column; gap: 36px;">
  <div lang="ru" style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 44px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.1;">Concept A · contact sheet</div>
    <div style="font-size: 16px; line-height: 1.5; color: rgba(255,255,255,0.72); max-width: 1560px;">The quiz builds one object, a contact sheet: every style the user picks becomes a frame, and the same sheet turns into their plan at the peak screen. "How it works" moves to the end, next to the price doubts.</div>
  </div>

  <div style="display: flex; gap: 40px; align-items: flex-start;">

    <!-- A1 hook -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 22px; display: flex; align-items: center; font-size: 13px; color: rgba(255,255,255,0.72);"><span class="tag">A1</span>Cover · continues the ad<span class="need" style="margin-left: 10px;"></span></div>
      <div class="ph">
        <img class="fill" src="img/1bcf6ebd340b2c209118a51eea05f0bc.webp" alt="Sample portrait, golden hour" style="object-position: 50% 20%;">
        <img class="fill x2" src="img/61d89b39ec612971a950488347f4729a.webp" alt="" style="object-position: 50% 20%;">
        <img class="fill x3" src="img/0ab866f4416cfd2c7a7b80fa122c948b.webp" alt="" style="object-position: 50% 20%;">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,15,0.35) 0%, rgba(8,8,15,0) 14%, rgba(8,8,15,0) 36%, rgba(8,8,15,0.72) 58%, #08080f 76%);"></div>
        
        <div style="position: absolute; top: 62px; right: 24px; width: 200px; height: 28px;">
          <span class="cap c1">Golden hour</span>
          <span class="cap c2">Paris balcony</span>
          <span class="cap c3">Studio white</span>
        </div>
        <div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column;">
          <div style="font-size: 36px; font-weight: 900; letter-spacing: -1.3px; line-height: 1.02; text-wrap: balance;">Studio portraits from your selfies</div>
          <div class="serif" style="margin-top: 4px; font-size: 44px; line-height: 1; color: #ff9d9a;">in about 5 minutes</div>
          <div style="margin-top: 12px; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,0.72); max-width: 320px;">Answer two questions and we plan the photoshoot around you</div>
          <div style="margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.8);"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.2 6.6L12 17.4l-5.8 3.2 1.2-6.6L2.5 9.4l6.6-.8z" fill="#ffc14d"></path></svg><span>4.9 rating · 2 million portraits</span></div>
          <a class="cta" href="#a2" style="margin-top: 20px;">Plan my photoshoot</a>
        </div>
      </div>
    </div>

    <!-- A2 goal -->
    <div id="a2" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 22px; display: flex; align-items: center; font-size: 13px; color: rgba(255,255,255,0.72);"><span class="tag">A2</span>Goal · one tap moves on</div>
      <div class="ph">
        <div class="pbar"><div class="pfill pb2"></div></div>
        <div style="position: absolute; top: 96px; left: 24px; right: 24px;">
          <div style="font-size: 32px; font-weight: 900; letter-spacing: -1.1px; line-height: 1.05; text-wrap: balance;">What are the photos for</div>
          <div style="margin-top: 10px; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,0.72);">We suggest styles that fit your answer</div>
        </div>
        <div style="position: absolute; top: 232px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ goals }}" as="g" hint-placeholder-count="4">
            <button type="button" class="row rise" onClick="{{ g.pick }}" aria-pressed="{{ g.pressed }}" style="border: 1.5px solid {{ g.borderColor }}; background-color: {{ g.bg }}; animation-delay: {{ g.delay }};">
              <img class="{{ g.thumbClass }}" src="{{ g.img }}" alt="" style="width: 72px; height: 72px; border-radius: 16px; object-fit: cover; object-position: 50% 25%; flex: none;">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 17px; font-weight: 700;">{{ g.title }}</span>
                <span style="font-size: 13px; line-height: 1.3; color: rgba(255,255,255,0.72);">{{ g.sub }}</span>
                <sc-if value="{{ g.need }}" hint-placeholder-val="{{ false }}"><span class="need" style="font-size: 11px; line-height: 1.3;"></span></sc-if>
              </span>
              <span style="position: relative; width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: 2px solid {{ g.radioColor }}; flex: none; transition: border-color .16s ease-out;">
                <span class="rdot" style="position: absolute; inset: 3px; border-radius: 8px; background: #ff9d9a; transform: scale({{ g.dotScale }});"></span>
              </span>
            </button>
          </sc-for>
        </div>
        <a href="#a3" style="position: absolute; left: 50%; bottom: 36px; width: 200px; height: 44px; margin-left: -100px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: rgba(255,255,255,0.72); text-decoration: none;">Tap one to continue</a>
      </div>
    </div>

    <!-- A3 styles -->
    <div id="a3" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 22px; display: flex; align-items: center; font-size: 13px; color: rgba(255,255,255,0.72);"><span class="tag">A3</span>Styles · picks drop into the shoot tray</div>
      <div class="ph">
        <div class="pbar"><div class="pfill pb3"></div></div>
        <div style="position: absolute; top: 92px; left: 24px; right: 24px;">
          <div style="font-size: 32px; font-weight: 900; letter-spacing: -1.1px; line-height: 1.05;">Pick up to 3 styles</div>
          <div style="margin-top: 8px; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,0.72);">We started you with two for {{ goalLower }}. Change them if you like</div>
        </div>
        <div style="position: absolute; top: 200px; left: 20px; right: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <sc-for list="{{ styles }}" as="s" hint-placeholder-count="6">
            <button type="button" class="tile" onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" aria-label="{{ s.title }}">
              <img class="fill" src="{{ s.img }}" alt="" style="object-position: 50% 25%;">
              <span style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,15,0) 45%, rgba(8,8,15,0.82) 100%);"></span>
              <span style="position: absolute; left: 12px; bottom: 11px; font-family: Archivo, sans-serif; font-size: 14px; font-weight: 700; color: #ffffff;">{{ s.title }}</span>
              <span class="check" style="background-color: {{ s.checkBg }};">
                <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1.5 5.2l3 3 6-6.4" fill="none" stroke="{{ s.checkFg }}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
              <span class="selring" style="opacity: {{ s.ringOpacity }};"></span>
            </button>
          </sc-for>
        </div>
        <div style="position: absolute; top: 660px; left: 24px; right: 24px; height: 56px; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 13px; font-weight: 600;">Your photoshoot</span>
            <span style="font-size: 13px; color: rgba(255,255,255,0.72);">{{ countLabel }}</span>
          </div>
          <div style="display: flex; gap: 8px;">
            <sc-for list="{{ tray }}" as="t" hint-placeholder-count="3">
              <sc-if value="{{ t.filled }}" hint-placeholder-val="{{ true }}">
                <div class="slot trayin"><img src="{{ t.img }}" alt="{{ t.title }}" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block;"></div>
              </sc-if>
              <sc-if value="{{ t.empty }}" hint-placeholder-val="{{ false }}">
                <div class="slot" style="border: 1px dashed rgba(255,255,255,0.28);"></div>
              </sc-if>
            </sc-for>
          </div>
        </div>
        <div style="position: absolute; left: 24px; right: 24px; bottom: 40px;"><a class="{{ ctaClass }}" href="#a4">Build my photoshoot</a></div>
      </div>
    </div>

    <!-- A4 build -->
    <div id="a4" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 22px; display: flex; align-items: center; font-size: 13px; color: rgba(255,255,255,0.72);"><span class="tag">A4</span>Building the sheet · 3.6 s, tap to skip</div>
      <a class="ph" href="#a5" aria-label="Skip to your plan">
        <div class="pbar"><div class="pfill pb4"></div></div>
        <div style="position: absolute; top: 96px; left: 24px; right: 24px; font-size: 28px; font-weight: 900; letter-spacing: -0.9px; line-height: 1.08; text-wrap: balance;">Putting your photoshoot together</div>
        <div style="position: absolute; top: 204px; left: 12px; right: 12px; box-sizing: border-box; padding: 12px; border-radius: 24px; background: #111120; border: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <sc-for list="{{ sheet }}" as="f" hint-placeholder-count="3">
            <div class="frame {{ f.buildClass }}" style="height: 186px;">
              <img class="fill" src="{{ f.img }}" alt="" style="object-position: 50% 25%;">
              <span class="fscrim"></span>
              <span class="flabel">{{ f.label }}</span>
            </div>
          </sc-for>
          <div class="frame bf4" style="height: 186px;">
            <img class="fill" src="img/bc6c9171d3c34f72dbd53c8f23774819.jpg" alt="" style="object-position: 50% 30%;">
            <span class="fscrim"></span>
            <span style="position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 20px; background: rgba(8,8,15,0.6); display: flex; align-items: center; justify-content: center;"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M2 1.5v13l11-6.5z" fill="#ffffff"></path></svg></span>
            <span class="flabel">Video</span>
          </div>
        </div>
        <div style="position: absolute; top: 628px; left: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.45;">
          <div style="display: flex; align-items: flex-start; gap: 12px;">
            <svg class="bt1" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="10" cy="10" r="10" fill="#ff9d9a"></circle><path d="M5.8 10.2l2.8 2.8 5.6-6" fill="none" stroke="#08080f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span class="bl1">Goal: {{ goalTitle }}</span>
          </div>
          <div style="display: flex; align-items: flex-start; gap: 12px;">
            <svg class="bt2" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="10" cy="10" r="10" fill="#ff9d9a"></circle><path d="M5.8 10.2l2.8 2.8 5.6-6" fill="none" stroke="#08080f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span class="bl2">Styles: {{ pickedTitles }}</span>
          </div>
          <div style="display: flex; align-items: flex-start; gap: 12px;">
            <svg class="bt3" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="flex: none; margin-top: 1px;"><circle cx="10" cy="10" r="10" fill="#ff9d9a"></circle><path d="M5.8 10.2l2.8 2.8 5.6-6" fill="none" stroke="#08080f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span class="bl3">One video scene added <span class="need" style="font-size: 11px;"></span></span>
          </div>
        </div>
        <div style="position: absolute; left: 24px; right: 24px; bottom: 60px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12); overflow: hidden;"><div class="btimer" style="width: 100%; height: 100%; background: rgba(255,255,255,0.6);"></div></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 13px; color: rgba(255,255,255,0.72);">Tap to skip</div>
      </a>
    </div>

    <!-- A5 plan -->
    <div id="a5" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 22px; display: flex; align-items: center; font-size: 13px; color: rgba(255,255,255,0.72);"><span class="tag">A5</span>Plan · the peak, the same sheet develops</div>
